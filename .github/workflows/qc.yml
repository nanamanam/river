      - name: Run QC
        run: |
          /home/ubuntu/tha-chin-flood-ai/.venv/bin/python scripts/qc_v2_diag.py
      - name: QC result
        run: |
          echo "=== OUTPUT ==="
          ls -lh wl_clean_v1.parquet
